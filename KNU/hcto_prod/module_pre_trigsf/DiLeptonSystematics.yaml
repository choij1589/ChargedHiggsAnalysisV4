# Systematics of the HcToWA DiLepton analyzer (2024), read by SystematicHelper.
# Event-loop lanes rebuild only the affected objects (index lists, no copies);
# weight-only lanes swap one factor of the Central weight. The analyzer adds a
# "<factor>_NotImplemented" lane per weight factor (that factor divided out)
# and keeps only the lanes that differ from Central in a channel:
#   DIMU: all event-loop lanes, PileupReweight, MuonIDSF, TopPtReweight (TT powheg)
#   EMU : all event-loop lanes, PileupReweight, ElectronRecoSF, MuonIDSF, ElectronIDSF,
#         BtagSF_*, TopPtReweight
#   ZEE : ElectronRes, ElectronEn, PileupReweight, ElectronRecoSF, ElectronIDSF,
#         ElectronTrigSFProxy, TopPtReweight
# MuonIDSF / ElectronIDSF: our tag-and-probe ID SFs (data/2024/LeptonID/, 2026-11-25);
# in ZEE ElectronIDSF replaces the EGM proxy ID SF (ElectronIDSFProxy, no longer used).
# Central has NO top-pT weight; TopPtReweight gives the lane
# "TopPtReweight_Applied" (TTLL/TTLJ powheg only).
systematics:
  - syst: JetRes
    evtLoopAgain: true
  - syst: JetEn
    evtLoopAgain: true
    source: total
  - syst: ElectronRes
    evtLoopAgain: true
  - syst: ElectronEn
    evtLoopAgain: true
  - syst: MuonEn
    evtLoopAgain: true
  - syst: MuonRes
    evtLoopAgain: true
  - syst: UnclusteredEn
    evtLoopAgain: true
  - syst: PileupReweight
  - syst: ElectronRecoSF
  - syst: BtagSF_HFcorr
  - syst: BtagSF_HFuncorr
  - syst: BtagSF_LFcorr
  - syst: BtagSF_LFuncorr
  - syst: TopPtReweight
    oneSided: true
  - syst: MuonIDSF
  - syst: ElectronIDSF
  - syst: ElectronTrigSFProxy
